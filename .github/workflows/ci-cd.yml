name: CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    name: Lint, tests and build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.22.0'
      - name: Enable Corepack
        run: corepack enable
      - name: Install dependencies
        run: yarn install --immutable
      - name: Run ESLint
        run: yarn lint
      - name: Run tests
        run: yarn test
      - name: Build application
        run: |
          cp .env.example .env
          yarn build

  deploy:
    name: Deploy production
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    needs: ci
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://manora.tj
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_PORT: ${{ secrets.SSH_PORT }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
      DEPLOY_SHA: ${{ github.sha }}
    steps:
      - name: Configure restricted SSH key
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/manora-deploy
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          test -s ~/.ssh/manora-deploy
          test -s ~/.ssh/known_hosts
      - name: Deploy exact commit and verify health
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/manora-deploy -p "${SSH_PORT:-22}" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=8 \
            "$SSH_USER@$SSH_HOST" "deploy $DEPLOY_SHA"
      - name: Remove SSH credentials
        if: always()
        run: rm -f ~/.ssh/manora-deploy ~/.ssh/known_hosts
